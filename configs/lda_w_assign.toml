# LDA+W new, assign: score = w * log(P_LDA + 1e-4) + (1 - w) * log(P_W + floor); residues are assigned
# to composition slots (linear_sum_assignment), so the labels match the remaining sequence composition.
# 263 proteins (5D): 92.14 % without correction, 92.25 % T+pH standard, 92.35 % T+pH test.
[parameters]
algo = "filtered"       # Options: lda, lda_bootstrap, sw, filtered, filtered_bootstrap
classifier = "lda"      # Options: lda, et_lda
n_projections = 4000    # not used by W, kept for the output filenames
seed = 42
k = 0
device = "cpu"
with_bins = true        # W trash (auxiliary points) with costs kappa1, kappa2
sample_method = "ALL"   # every train point, class mass = remaining composition (W). Options: BEST, RAND, CENT
vote_type = "SPECIAL"   # Options: NORMAL
scale = true
eps = 0.75
kappa1 = 3.0
kappa2 = 3.0
nuclei = ["HN", "N", "CO", "CA", "CB"]
note = "lda_w_assign"
# Temperature and pH correction. "test" is the best in lda_sw_validate; lda_sw_classify always
# corrects the training data to reference_temperature / reference_ph (as "standard"), and the shifts of
# the classified protein are used as given. Set both corrections to false for no correction.
temperature_correction = true
reference_temperature = 298.0
ph_correction = true
reference_ph = 7.0
correction_reference = "test"   # Options: standard (all proteins to reference_temperature / reference_ph), test (training proteins to the T, pH and ionic strength of the test protein)
transport = "w"         # Options: sw, w (multidimensional Wasserstein, wnet)
w_metric = "L1"         # Options: L1, L2, LINF
combine = "assign"      # Options: tree (thesis decision tree), mix, assign
combine_weight = 0.7    # score w * log LDA + (1 - w) * log(W + floor)
combine_floor = 0.1
combine_slack = 1.0     # slots per class = composition * slack
